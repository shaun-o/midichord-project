[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midichord"
version = "0.1.0"
description = "Turn single notes on a MIDI channel into chords and arpeggios."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mido>=1.3", "windows-curses; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
midichord = "midichord.cli:main"

[tool.setuptools]
packages = ["midichord"]

[tool.ruff]
line-length = 100
